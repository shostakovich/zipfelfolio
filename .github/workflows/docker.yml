name: Build and publish container

# Every push to main publishes `latest` once the tests and the image's smoke test pass, plus
# `sha-<commit>` to roll back to. `latest` moves only for the commit that is still main's head when
# the image is pushed, so a manual run on another ref or a run overtaken by a newer push publishes
# just its `sha-` tag. Pull requests build and smoke-test the image without publishing it; ci.yml
# runs their tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.ref) || 'docker-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Erlang/OTP and Elixir
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}

      - name: Fetch deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test

      - name: Build assets
        run: mix assets.setup && mix assets.deploy

  build:
    needs: test
    # The test job is skipped on pull requests; a failed or cancelled one still stops the build.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zipfelfolio:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        id: smoke
        run: |
          docker run -d --name zipfelfolio -p 4000:4000 \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e PHX_HOST=localhost \
            -e SMTP_HOST=smtp.invalid \
            -e SMTP_USERNAME=smoke \
            -e SMTP_PASSWORD=smoke \
            -e MAIL_FROM=smoke@example.com \
            zipfelfolio:smoke
          timeout 120 sh -c 'until curl -fsS -o /dev/null http://localhost:4000/up; do sleep 2; done'
          # /up only queries the database; the login page renders the layout and its icons.
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' \
            http://localhost:4000/users/log-in)
          if [ "$status" != 200 ]; then
            echo "::error::GET /users/log-in returned $status"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' \
            http://localhost:4000/setzkasten/fonts/Figtree-Variable.woff2)
          if [ "$status" != 200 ]; then
            echo "::error::GET /setzkasten/fonts/Figtree-Variable.woff2 returned $status"
            exit 1
          fi

      - name: Show container logs
        if: failure() && steps.smoke.outcome == 'failure'
        run: docker logs zipfelfolio

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that this commit is still the head of main
        if: github.event_name != 'pull_request'
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
            type=sha,prefix=sha-

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
