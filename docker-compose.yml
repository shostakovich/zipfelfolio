# Production on the home server: /web/config/zipfelfolio/compose.yml, secrets in .env next to it.
services:
  zipfelfolio:
    image: ghcr.io/shostakovich/zipfelfolio:${ZIPFELFOLIO_TAG:-latest}
    container_name: zipfelfolio
    restart: unless-stopped
    ports:
      - "4100:4000"
    environment:
      TZ: Europe/Berlin
      PHX_HOST: ${PHX_HOST:-folio.rocu.de}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate one with: openssl rand -hex 64}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:?}
    volumes:
      # Owned by uid 1000.
      - /web/data/zipfelfolio:/app/data
