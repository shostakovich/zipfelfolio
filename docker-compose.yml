# On the home server as /web/config/zipfelfolio/compose.yml; secrets in .env next to it.
services:
  zipfelfolio:
    image: ghcr.io/shostakovich/zipfelfolio:${ZIPFELFOLIO_TAG:-latest}
    container_name: zipfelfolio
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
      PHX_HOST: folio.rocu.de
    volumes:
      # Owned by uid 1000.
      - /web/data/zipfelfolio:/app/data
    # Caddy reaches the app as zipfelfolio:4000 on this network.
    networks:
      - frontend

networks:
  frontend:
    external: true
